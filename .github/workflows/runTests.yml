name: runTests

on: push

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
     - uses: actions/checkout@v6

     - name: Set up JDK 21
       uses: actions/setup-java@v4
       with:
         java-version: 21
         distribution: 'temurin'

     - name: Make gradlew executable
       run: chmod +x gradlew

     - name: Build and install
       run: ./gradlew installDist
     - run: make test